#
# Synology Container Manager deployment. Copy this file as compose.yaml and create
# a .env file beside it containing GAME_SAVE_TOKEN and GAME_SAVE_ADMIN_TOKEN.
# Add GAME_SAVE_OPENSAVE_USERNAME and GAME_SAVE_OPENSAVE_PASSWORD to enable /opensave/.

services:
  game-save:
    image: jun9100/game-save:v1.4.0
    container_name: game-save
    user: "1026:100"
    env_file:
      - .env
    ports:
      - "8788:8787"
    volumes:
      - /volume1/docker/game-save/data:/var/lib/game-save
    restart: unless-stopped
